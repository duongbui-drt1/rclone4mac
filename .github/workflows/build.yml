# Github Actions build for rclone-extra (Linux, Windows, macOS, Android)
name: Build rclone-extra - Multi Platform

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select target platform to build"
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - windows
          - macos
          - android
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # --- JOB 1: DESKTOP BINARIES (Linux, Windows, macOS) ---
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      github.event_name == 'push' ||
      inputs.target == 'all'      ||
      inputs.target == 'linux'    ||
      inputs.target == 'windows'  ||
      inputs.target == 'macos'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - name: linux-arm-v7
            goos: linux
            goarch: arm
            goarm: 7
            ext: ''
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
          - name: windows-arm64
            goos: windows
            goarch: arm64
            ext: '.exe'
          - name: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - name: Gate Check
        id: gate
        run: |
          TARGET="${{ inputs.target }}"
          GOOS="${{ matrix.goos }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "$GOOS" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "macos" ] && [ "$GOOS" = "darwin" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: true

      # --- WINDOWS PRE-REQUISITES (Win64 CGO / WinFsp cmount) ---
      - name: Install MinGW (Windows amd64 Only)
        if: steps.gate.outputs.skip == 'false' && matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Setup WinFsp Headers (Windows amd64 Only)
        if: steps.gate.outputs.skip == 'false' && matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          wget -q -O winfsp.zip https://github.com/winfsp/winfsp/archive/refs/tags/v2.1.zip
          unzip -q winfsp.zip
          echo "WINFSP_INC=$(pwd)/winfsp-2.1/inc/fuse" >> $GITHUB_ENV

      - name: Setup Icon (Windows Only)
        if: steps.gate.outputs.skip == 'false' && matrix.goos == 'windows'
        run: |
          go install github.com/akavel/rsrc@latest
          curl -L https://raw.githubusercontent.com/rclone/rclone/master/graphics/logo/ico/logo_symbol_color.ico -o rclone.ico
          rsrc -ico rclone.ico -o rclone.syso

      # --- BUILD STEP ---
      - name: Build Rclone (${{ matrix.name }})
        if: steps.gate.outputs.skip == 'false'
        shell: bash
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          ${{ matrix.goarm != '' && format('export GOARM={0}', matrix.goarm) || '# no GOARM' }}

          VERSION="$(git describe --tags --always --dirty)"
          echo "Building version: $VERSION for $GOOS/$GOARCH"

          LDFLAGS_BASE="-s -w -buildid= -X github.com/rclone/rclone/fs.Version=${VERSION}"

          if [ "$GOOS" == "windows" ] && [ "$GOARCH" == "amd64" ]; then
            echo "Configuring Windows x64 CGO build..."
            export CGO_ENABLED=1
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            export CGO_CFLAGS="-I$WINFSP_INC"
            export CGO_LDFLAGS="-static"
            LDFLAGS="$LDFLAGS_BASE -extldflags '-static -static-libgcc -static-libstdc++'"
            TAGS="-tags cmount"
          elif [ "$GOOS" == "linux" ]; then
            echo "Configuring Linux Pure-Static Build..."
            export CGO_ENABLED=0
            TAGS="-tags netgo,osusergo"
            LDFLAGS="$LDFLAGS_BASE"
          else
            echo "Configuring Pure Go build for $GOOS/$GOARCH..."
            export CGO_ENABLED=0
            TAGS=""
            LDFLAGS="$LDFLAGS_BASE"
          fi

          go build -v -trimpath -mod=readonly -ldflags "$LDFLAGS" $TAGS -o rclone-${{ matrix.name }}${{ matrix.ext }} .

      - name: Package zip
        if: steps.gate.outputs.skip == 'false'
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          ZIP_NAME="rclone-${{ matrix.name }}.zip"
          FOLDER="rclone-${VERSION}-${{ matrix.name }}"
          mkdir -p "${FOLDER}"
          cp "rclone-${{ matrix.name }}${{ matrix.ext }}" "${FOLDER}/rclone${{ matrix.ext }}"
          zip -r "${ZIP_NAME}" "${FOLDER}/"
          rm -rf "${FOLDER}"

      - name: Upload zip to GitHub Release (tag push only)
        if: steps.gate.outputs.skip == 'false' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rclone-${{ matrix.name }}.zip

      - name: Upload Artifact
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: rclone-${{ matrix.name }}
          path: rclone-${{ matrix.name }}.zip
          if-no-files-found: error


  # --- JOB 2: ANDROID BINARIES ---
  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      github.event_name == 'push' ||
      inputs.target == 'all'      ||
      inputs.target == 'android'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: true

      - name: Build Android Targets
        run: |
          set -euo pipefail

          VERSION="$(git describe --tags --always --dirty)"
          echo "Building Android version: $VERSION"
          FLAGS="-s -w -buildid= -X github.com/rclone/rclone/fs.Version=${VERSION}"

          mkdir -p build build-logs

          NDK_ROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API="23"

          for ARCH in arm arm64 386 amd64; do
            echo "Building for android/$ARCH..."

            export GOOS=android
            export GOARCH=$ARCH
            export CGO_ENABLED=1

            if [ "$ARCH" == "arm" ]; then
              CC_BIN="$NDK_ROOT/armv7a-linux-androideabi${API}-clang"
            elif [ "$ARCH" == "arm64" ]; then
              CC_BIN="$NDK_ROOT/aarch64-linux-android${API}-clang"
            elif [ "$ARCH" == "386" ]; then
              CC_BIN="$NDK_ROOT/i686-linux-android${API}-clang"
            elif [ "$ARCH" == "amd64" ]; then
              CC_BIN="$NDK_ROOT/x86_64-linux-android${API}-clang"
            fi

            export CC="$CC_BIN"

            go build -v -trimpath -mod=readonly -ldflags "$FLAGS" \
              -o build/rclone-android-$ARCH . 2>&1 | tee "build-logs/build-android-$ARCH.log"

            if [ -f "build/rclone-android-$ARCH" ]; then
              echo "Successfully built rclone-android-$ARCH"
              ls -lh build/rclone-android-$ARCH
            else
              echo "Failed to build rclone-android-$ARCH"
              exit 1
            fi
          done

      - name: Package Android zip
        run: |
          zip -j rclone-android-all.zip build/rclone-android-*

      - name: Upload Android zip to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rclone-android-all.zip

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rclone-android-all
          path: rclone-android-all.zip
          if-no-files-found: error
